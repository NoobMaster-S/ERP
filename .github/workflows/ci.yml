name: Multi-Tenant ERP CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Django System Check & Migrations Check
        run: |
          cd backend
          python manage.py check
      - name: Run Backend Unit & Tenant Isolation Tests
        run: |
          cd backend
          python manage.py test

  admin-checks:
    name: Admin Web Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json
      - name: Install Admin Dependencies
        run: |
          cd admin-panel
          npm ci
      - name: Run Next.js Typecheck & Build
        run: |
          cd admin-panel
          npm run build

  business-app-checks:
    name: Flutter Business App Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter with FVM
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Verify Flutter SDK
        run: flutter --version
      - name: Install Flutter Packages
        run: |
          cd business-app
          flutter pub get
      - name: Flutter Analyze
        run: |
          cd business-app
          flutter analyze
      - name: Run Flutter Unit Tests
        run: |
          cd business-app
          flutter test
