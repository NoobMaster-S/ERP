name: business_app
description: "Cross-platform offline-first Flutter ERP Business Client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Routing
  go_router: ^13.2.0

  # Local Offline Database
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

  # Remote API
  graphql_flutter: ^5.1.2

  # Security & Utilities
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  intl: ^0.19.0
  connectivity_plus: ^6.1.0

  # Documents & Hardware Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  drift_dev: ^2.16.0
  build_runner: ^2.4.8

dependency_overrides:
  analyzer: 14.4.0

flutter:
  uses-material-design: true
